<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bharti Kumari -Contact</title>

  <!-- Yahi sabse important hai -->
  <link rel="stylesheet" href="style.css" />

  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <nav>
      <div class="logo">Bharti Kumari</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <div class="socials">
        <a href="https://github.com/Bhartix07" target="_blank"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/bharti-kumari-35ab542ba/" target="_blank"><i class="fab fa-linkedin"></i></a>
        <button id="dark-toggle">🌙</button>
      </div>
    </nav>
  </header>

  <section class="contact fade-in">
    <h2>📩 Contact Me</h2>
    <form class="contact-form">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <footer>
    © 2025 Bharti Kumari | Made with 💜
  </footer>

  <!-- Chatbot -->
  <button id="chatbot-toggle" class="chatbot-toggle">💬</button>
  <div id="chatbot-window" class="chatbot-window">
    <div class="chatbot-header">
      <h4>Portfolio Assistant</h4>
      <button id="chatbot-close" class="chatbot-close">&times;</button>
    </div>
    <div id="chatbot-messages" class="chatbot-messages"></div>
    <div class="chatbot-input-area">
      <input id="chatbot-input" type="text" placeholder="Ask anything about Bharti..." />
      <button id="chatbot-send">➤</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
